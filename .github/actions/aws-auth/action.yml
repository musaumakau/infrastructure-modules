name: 'AWS OIDC auth'
description: 'Assume an IAM role via OIDC — no long-lived keys'

inputs:
  role-arn:
    description: 'ARN of the IAM role to assume'
    required: false
    default: 'arn:aws:iam::649203810550:role/EksOIDCRole'  
  aws-region:
    description: 'AWS region'
    required: false
    default: 'eu-west-1'    
  session-name-suffix:
    description: 'Appended to github-actions- for the session name'
    required: false
    default: '${{ github.run_id }}'

runs:
  using: composite
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1 SHA-pinned
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: "github-actions-${{ inputs.session-name-suffix }}" 