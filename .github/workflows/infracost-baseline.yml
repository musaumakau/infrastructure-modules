name: Infracost Baseline

on:
  push:
    branches: [main]
    paths:
      - 'eks/**'
      - 'vpc/**'
      - 'kubernetes-addons/**'
      - 'cicd-state/**' 
  workflow_dispatch:

permissions: {}

jobs:
  baseline:
    name: Update cost baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::649203810550:role/EKSOIDCRoleForPR
          aws-region: eu-west-1

      - name: Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280  # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate and store baseline
        run: |
          set -euo pipefail
          echo "::group::Infracost baseline"
          infracost breakdown \
            --config-file=.infracost/infracost.yml \
            --format=json \
            --out-file=/tmp/infracost-baseline.json
          echo "::endgroup::"

          echo "::group::Baseline summary"
          infracost output \
            --path=/tmp/infracost-baseline.json \
            --format=table
          echo "::endgroup::"

      - name: Upload baseline to S3
        run: |
          set -euo pipefail
          aws s3 cp /tmp/infracost-baseline.json \
            "s3://${{ vars.PLAN_MANIFEST_BUCKET }}/infracost-baseline/main/baseline.json"
          echo "::notice::Baseline saved to S3"