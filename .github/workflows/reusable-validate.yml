name: Reusable — Validate
on:
  workflow_call:
    inputs:
      modules:
        description: 'JSON array of modules to validate, e.g. ["vpc","eks"]'
        type: string
        required: true
      terraform-version:
        type: string
        required: false
        default: '1.7.5'

permissions: {}

jobs:
  validate:
    name: "Validate [${{ matrix.module }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    strategy:
      matrix:
        module: ${{ fromJson(inputs.modules) }}
      fail-fast: false

    defaults:
      run:
        working-directory: ./${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Terraform + Terragrunt setup
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ inputs.terraform-version }}
          module: ${{ matrix.module }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6  # v4.1.1

      - name: Cache TFLint plugins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: tflint-${{ runner.os }}-

      - name: TFLint init + run
        run: |
          set -euo pipefail
          tflint --init
          tflint --format compact