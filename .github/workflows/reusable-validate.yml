name: Reusable — Validate
on:
  workflow_call:
    inputs:
      modules:
        description: 'JSON array of modules to validate, e.g. ["vpc","eks"]'
        type: string
        required: true
      terraform-version:
        type: string
        required: false
        default: '1.7.5'

permissions: {}

jobs:
  validate:
    name: "Validate [${{ matrix.module }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    strategy:
      matrix:
        module: ${{ fromJson(inputs.modules) }}
      fail-fast: false

    defaults:
      run:
        working-directory: ./${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Terraform + Terragrunt setup
        uses: ./.github/actions/terraform-setup
        with:
          terraform-version: ${{ inputs.terraform-version }}
          module: ${{ matrix.module }}

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6.3.0

      - name: Cache TFLint plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
          restore-keys: tflint-${{ runner.os }}-

      - name: TFLint init + run
        run: |
          set -euo pipefail
          tflint --init
          tflint --format compact